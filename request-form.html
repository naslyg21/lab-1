<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">  
</head>

<body>
    <main class="container py-5">
        <h1>Request a tutoring session</h1>
            
       
<form class="request-form" action="process-request.php" method="post">

    <label for="course" class="form-label">Course</label>
    <select id="course" name="course" class="form-control" required>
        <option value="">Select a course</option>
        <option value="IS 6465">IS 6465</option>
        <option value="IS 6495">IS 6495</option>
        <option value="IS 6570">IS 6570</option>
    </select>

    <label for="topic" class="form-label mt-3">Topic</label>
    <input type="text" id="topic" name="topic"
           class="form-control" maxlength="120"
           placeholder="What do you need help with?" required>

    <label for="preferreddate" class="form-label mt-3">
        Preferred Date
    </label>
    <input type="date" id="preferreddate" name="preferreddate"
           class="form-control" required>

    <label for="preferredtime" class="form-label mt-3">
        Preferred Time
    </label>
    <select id="preferredtime" name="preferredtime"
            class="form-control" required>
        <option value="">Select a time</option>
        <option value="Morning">Morning</option>
        <option value="Afternoon">Afternoon</option>
        <option value="Evening">Evening</option>
    </select>

    <button type="submit" class="btn btn-primary mt-3">
        Request Session
    </button>

</form>

    </main>
</body>

</html>
